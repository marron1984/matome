<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f9">
<meta name="description" content="まとめサイトのまとめサイト。複数のまとめブログの新着・人気記事をまとめて読む。">
<title>まとめのまとめ</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 5.5C3 4.7 3.7 4 4.5 4H11v16H4.5A1.5 1.5 0 0 1 3 18.5zM13 4h6.5c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5H13z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-blogs" viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5zM2 12l10 5 10-5M2 16l10 5 10-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-1.7-1l-.4-2.4h-4l-.4 2.4c-.6.2-1.2.6-1.7 1l-2.3-1-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-1c.5.4 1.1.8 1.7 1l.4 2.4h4l.4-2.4c.6-.2 1.2-.6 1.7-1l2.3 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
</svg>

<header class="appbar">
  <button id="refresh" class="icon-btn" type="button" aria-label="更新">
    <svg class="icon"><use href="#i-refresh"></use></svg>
  </button>
  <h1 id="appbar-title">今日の記事</h1>
  <div id="appbar-right" class="appbar-right">
    <div class="segmented" role="tablist" aria-label="並び順">
      <button type="button" role="tab" data-sort="latest" aria-selected="false">新着</button>
      <button type="button" role="tab" data-sort="popular" aria-selected="true">人気</button>
    </div>
  </div>
</header>

<div id="progress" class="progress" hidden></div>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="メインナビゲーション">
  <button type="button" class="tab is-active" data-tab="latest">
    <span class="tab-logo">ま</span><span class="tab-label">最新</span>
  </button>
  <button type="button" class="tab" data-tab="search">
    <svg class="icon"><use href="#i-search"></use></svg><span class="tab-label">記事を探す</span>
  </button>
  <button type="button" class="tab" data-tab="bookmarks">
    <svg class="icon"><use href="#i-book"></use></svg><span class="tab-label">ブックマーク</span>
  </button>
  <button type="button" class="tab" data-tab="blogs">
    <svg class="icon"><use href="#i-blogs"></use></svg><span class="tab-label">ブログ</span>
  </button>
  <button type="button" class="tab" data-tab="settings">
    <svg class="icon"><use href="#i-gear"></use></svg><span class="tab-label">設定</span>
  </button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
